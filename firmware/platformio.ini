; espia firmware — PlatformIO configuration.
;
; Each supported board has its own environment. Board-specific pins and
; capabilities live in src/boards/, selected by the ESPIA_BOARD_* flag.
; See README.md for the list of supported boards.

[platformio]
default_envs = heltec_wifi_kit_32_v3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
lib_deps =
    olikraus/U8g2@^2.35.30

[env:heltec_wifi_kit_32_v3]
board = heltec_wifi_kit_32_V3
build_flags =
    ${env.build_flags}
    -D ESPIA_BOARD_HELTEC_WIFI_KIT_32_V3

[env:heltec_wifi_kit_32_v2]
board = heltec_wifi_kit_32_v2
build_flags =
    ${env.build_flags}
    -D ESPIA_BOARD_HELTEC_WIFI_KIT_32_V2

; Generic ESP32-C3 with an onboard 0.42" 72x40 OLED — sold unbranded under
; many names, hardware-compatible with the Waveshare ESP32-C3-0.42LCD
; design. `esp32-c3-devkitm-1` is Espressif's generic C3 board definition
; (160MHz, 4MB flash), which matches this one closely enough — there's no
; PlatformIO board entry for the clone itself.
[env:esp32_c3_oled_042]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ESPIA_BOARD_ESP32_C3_OLED_042
