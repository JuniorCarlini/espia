<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528.20 132.20">
  <style>
    circle.dot {
      fill: #5cec01;
      transform-box: fill-box;
      transform-origin: center;
      animation-name: dotIn, blinkPulse;
      animation-duration: 0.45s, 0.3s;
      animation-timing-function: cubic-bezier(.34,1.56,.64,1), ease-in-out;
      animation-delay: var(--d), 1.424s;
      animation-iteration-count: 1, 2;
      animation-fill-mode: both, both;
    }
    @keyframes dotIn {
      0%   { opacity: 0; transform: scale(0); }
      60%  { opacity: 1; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes blinkPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.15; }
    }
  </style>
