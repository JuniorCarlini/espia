[package]
name = "espia"
version = "0.1.0"
description = "espia desktop agent"
authors = ["espia contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/JuniorCarlini/espia"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
espia-core = { path = "../core" }
# The device-facing server (protocol/README.md): WebSocket now, mDNS/UDP
# discovery in a later step. Tauri 2 already runs a tokio runtime
# internally, reachable via `tauri::async_runtime::spawn` — this doesn't
# start a second one.
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
# Pure Rust, no system mDNS daemon dependency — matters cross-platform since
# Windows has no Bonjour/Avahi equivalent built in.
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
